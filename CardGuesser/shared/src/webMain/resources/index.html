<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#131B3A">
    <!-- Added to the home screen, the game opens full screen with no browser bars (the only way on iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CardGuesser">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>CardGuesser</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131B3A;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: 100%;
        }
        /* The game lives in the part of the screen that is really visible: not under the notch,
           the rounded corners, the home bar or Safari's toolbars. */
        #app {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            overflow: hidden;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            color: #8C97BF;
            font: 600 17px/1.4 system-ui, -apple-system, sans-serif;
        }
        #loading small { font-weight: 500; font-size: 14px; max-width: 420px; }
        #tip {
            position: fixed;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            transform: translateX(-50%);
            max-width: calc(100% - 32px);
            box-sizing: border-box;
            padding: 10px 14px;
            border-radius: 14px;
            background: #2A3566;
            color: #EEF1FF;
            font: 600 14px/1.35 system-ui, -apple-system, sans-serif;
            text-align: center;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
            display: none;
            z-index: 10;
        }
    </style>
    <script src="platform.js"></script>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading…</div>
<div id="tip"></div>
<script src="cardguesser.js"></script>
</body>
</html>
